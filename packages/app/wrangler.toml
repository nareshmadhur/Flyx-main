# Flyx 3.0 — Cloudflare Pages / Workers configuration
# Set FLYX_DEPLOY_TARGET=cloudflare to use this config

name = "flyx-v3"
compatibility_date = "2026-09-05"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# Static Assets
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 Databases
[[d1_databases]]
binding = "DB"
database_name = "flyx-v3-db"
database_id = "6804a539-6300-425c-acad-4aa027c79122"

# KV Namespaces
[[kv_namespaces]]
binding = "CACHE"
id = "3edb1a1cd28f4a9f8bb3a1fd462dd821"

# Environment Variables
[vars]
FLYX_DEPLOY_TARGET = "cloudflare"
FLYX_NO_BROWSER = "true"

# Observability (enable for debugging, disable for cost savings)
[observability]
enabled = false
